# Body of the golden grid cone (tests/test_golden.py), frozen with it.
# Sphere-cone, axisymmetric about the x axis.
[geometry]
# type marker
type = "cone"
# nose radius in [m]
nose_radius = 0.0001
# length of the body, measured axially from nose tip in [m] (the grid's x_end)
length = 0.01
# half-angle of the body in [deg]
half_angle = 7.0

# Points per piece of the moldline (geometry <type> run only).
[points]
# number of points on the nose arc
n_nose = 91
# number of points on the body
n_body = 200

# The path is relative to this file.
[output]
# moldline file (geometry <type> run only)
file = "cone_moldline.csv"
