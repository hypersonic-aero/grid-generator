[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-generator"
dynamic = ["version"]
description = "Structured grid generation utilities for Python"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Christoph Hader", email = "christoph.hader@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
keywords = ["grid", "structured-grid", "mesh", "cfd"]
dependencies = [
    "canonical-geometries>=0.4.0",
    "cfd-io>=0.6.0",
    "numpy>=2.0.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
]

[project.scripts]
grid-generator = "grid_generator.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "zensical",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/uahypersonics/grid-generator"
Repository = "https://github.com/uahypersonics/grid-generator"
Documentation = "https://uahypersonics.github.io/grid-generator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# bundled example cases: examples/<geometry type>/<name>/<files>
"grid_generator" = ["examples/*/*/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]