# tangent ogive, 1 mm nose radius, Mach 6, shock-line grid
#
# body: spherically blunted tangent ogive, 1 mm nose, sharp length 0.5 m, base
#   radius 0.05 m; the grid ends at x = 0.4 m, on the ogive
# shock.csv: flow-theory shock-shape run, method billig_blended, for Mach 6
#   (gamma = 1.4) on the same body, to x_e = 0.4 m (continued past the outflow here)
# the shock is the grid line j = 160 on every line (shock layer: 161 points); near
#   the nose the lines are too short for both the 1 um wall spacing and 1 % at the
#   shock, so the spacing at the shock is lowered there; the shortest lines (under
#   160 um) get uniform cells of just under 1 um (see the run summary)
# run: grid-generator tangent-ogive run

# Spherically blunted tangent ogive, axisymmetric about the x axis; the grid is the
# meridian plane.
[geometry]
# geometry type
type = "tangent-ogive"
# nose radius [m]
nose_radius = 1.0e-3
# length of the sharp ogive, tip to base [m]
length = 0.5
# base radius [m]
base_radius = 0.05

# Extent of the grid along the body.
[domain]
# end of the grid along x, measured from the nose tip [m] (on the ogive)
x_end = 0.4

# Shock line: the shock curve is a grid line; the outer boundary lies
# margin_factor x (the wall-to-shock distance) + min_offset from the wall.
[shock]
# shock curve: x, y columns (flow-theory shock-shape run with a .csv output)
curve = "shock.csv"
# factor on the wall-to-shock distance
margin_factor = 1.5
# distance added beyond the scaled shock distance [m]
min_offset = 0.0

# along the wall, nose arc: equal angle steps
[points.nose]
# points on the nose arc
n_points = 81

# along the wall, ogive: from the junction to x_end, starting at the nose spacing
[points.body]
# distribution type
type = "geometric"
# points on the ogive
n_points = 301

# from the wall to the shock: fine at the wall and again at the shock
[points.shock_layer]
# distribution type: a given spacing at both ends
type = "vinokur"
# points from the wall to the shock, both included
n_points = 161
# wall spacing [m]
first_spacing = 1.0e-6
# spacing at the shock, as a fraction of the wall-to-shock distance
end_spacing_fraction = 0.01

# from the shock to the outer boundary: growing from the spacing at the shock
[points.freestream]
# distribution type
type = "geometric"
# points from the shock to the outer boundary, both included
n_points = 41

# Boundary names in the grid file.
[markers]
# the body
wall = "wall"
# outer boundary
outer = "farfield"
# outflow plane at x_end
outflow = "outflow"
# stagnation line ahead of the nose
symmetry = "symmetry"

# The path is relative to this file; the extension picks the format (.su2, .h5, .msh, ...)
[output]
# grid file
filename = "ogive_m6_rn1.h5"
